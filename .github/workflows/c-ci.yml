name: C Build & Syntax Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install GCC
      run: sudo apt-get update && sudo apt-get install -y gcc

    - name: Check and Compile C Files
      run: |
        echo "Compiling all C source files..."
        for file in $(find . -name "*.c"); do
          echo "Compiling $file..."
          gcc -Wall -Wextra -fsyntax-only "$file"
        done
        echo "All C files passed syntax and safety build checks!"
